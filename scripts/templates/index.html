<!DOCTYPE html>
<html>
<head>
    <title>UNO Q File Uploader</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        #drop-area { border: 2px dashed #007bff; border-radius: 20px; width: 400px; height: 200px; display: flex; justify-content: center; align-items: center; background-color: white; cursor: pointer; transition: background 0.3s; }
        #drop-area.highlight { background-color: #e1f5fe; }
        p { font-size: 1.2rem; color: #555; }
    </style>
</head>
<body>
    <div id='drop-area'>
        <p>Drag & Drop Images Here</p>
    </div>

    <script>
        let dropArea = document.getElementById('drop-area');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('highlight'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('highlight'), false);
        });

        dropArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            ([...files]).forEach(uploadFile);
        }

        function uploadFile(file) {
            let url = '/upload';
            let formData = new FormData();
            formData.append('file', file);

            fetch(url, {
                method: 'POST',
                body: formData
            })
            .then(() => { alert('Upload Successful: ' + file.name); })
            .catch(() => { alert('Upload Failed'); });
        }
    </script>
</body>
</html>
